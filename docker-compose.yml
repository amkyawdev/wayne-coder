version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace/project/wayne-coder
      - /workspace/project/wayne-coder/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - cloud-ai-network
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace/project/wayne-coder
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - cloud-ai-network

networks:
  cloud-ai-network:
    driver: bridge