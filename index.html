<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cloud AI - Futuristic AI Coding Workspace">
  <meta name="theme-color" content="#0B1020">
  
  <title>Cloud AI - AI Coding Workspace</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Prism.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/animations.css">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/components.css">
<style>
    /* Quick fix for missing styles */
    body {
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      background: #0B1020;
      color: #EAEAEA;
    }
    
    .app-container {
      display: flex;
      min-height: 100vh;
    }
    
    .canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: #0B1020;
    }
    
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 58px;
      height: 100vh;
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(91, 140, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      z-index: 100;
    }
    
    .sidebar-logo {
      margin-bottom: 24px;
    }
    
    .logo-icon {
      font-size: 32px;
    }
    
    .sidebar-nav {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .sidebar-item {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .sidebar-item:hover {
      background: rgba(20, 20, 30, 0.8);
    }
    
    .sidebar-item.active {
      background: rgba(0, 245, 255, 0.1);
    }
    
    .sidebar-item.active .sidebar-link {
      color: #00F5FF;
    }
    
    .sidebar-link {
      background: none;
      border: none;
      color: #8892A8;
      cursor: pointer;
      padding: 8px;
    }
    
    .sidebar-link svg {
      width: 22px;
      height: 22px;
    }
    
    .sidebar-version {
      font-size: 10px;
      color: #4A5568;
      margin-top: auto;
    }
    
    .main-content {
      flex: 1;
      margin-left: 58px;
      min-height: 100vh;
    }
    
    .page-container {
      padding: 24px;
      padding-top: calc(60px + 24px);
    }
    
    :root {
      --bg-primary: #0B1020;
      --bg-secondary: #0D1225;
      --bg-tertiary: #111A30;
      --panel-bg: rgba(20, 20, 30, 0.6);
      --panel-elevated: rgba(30, 30, 45, 0.8);
      --panel-glass: rgba(20, 20, 30, 0.85);
      --accent-primary: #5B8CFF;
      --accent-secondary: #4366E0;
      --neon-cyan: #00F5FF;
      --neon-purple: #8B5CF6;
      --neon-green: #10B981;
      --text-primary: #EAEAEA;
      --text-secondary: #8892A8;
      --text-muted: #4A5568;
      --border-subtle: rgba(91, 140, 255, 0.1);
      --border-default: rgba(91, 140, 255, 0.2);
      --font-body: 'Inter', 'Segoe UI', sans-serif;
      --font-display: 'Orbitron', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --sidebar-width: 58px;
      --header-height: 60px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Three.js Canvas Background -->
    <div id="canvas-container" class="canvas-container"></div>
    
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar" aria-label="Main navigation"></nav>
    
    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Page Container (dynamically filled) -->
      <div id="page-container" class="page-container"></div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Three.js from CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- App Entry Point -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
