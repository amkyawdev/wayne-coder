<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cloud AI - Futuristic AI Coding Workspace">
  <meta name="theme-color" content="#0B1020">
  
  <title>Cloud AI - AI Coding Workspace</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Prism.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/animations.css">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/components.css">
<style>
    /* Mobile-first styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #0B1020;
      --bg-secondary: #0D1225;
      --bg-tertiary: #111A30;
      --panel-bg: rgba(20, 20, 30, 0.6);
      --panel-elevated: rgba(30, 30, 45, 0.8);
      --panel-glass: rgba(20, 20, 30, 0.85);
      --accent-primary: #5B8CFF;
      --accent-secondary: #4366E0;
      --neon-cyan: #00F5FF;
      --neon-purple: #8B5CF6;
      --neon-green: #10B981;
      --text-primary: #EAEAEA;
      --text-secondary: #8892A8;
      --text-muted: #4A5568;
      --border-subtle: rgba(91, 140, 255, 0.1);
      --border-default: rgba(91, 140, 255, 0.2);
      --font-body: 'Inter', 'Segoe UI', sans-serif;
      --font-display: 'Orbitron', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }
    
    html, body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100%;
      overflow: hidden;
    }
    
    body { font-size: 14px; line-height: 1.5; }
    
    .app-container {
      display: flex;
      height: 100vh;
      width: 100%;
    }
    
    .canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    /* Mobile sidebar */
    .sidebar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: var(--panel-glass);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 var(--space-sm);
      z-index: 100;
    }
    
    .sidebar-logo, .sidebar-version { display: none; }
    
    .sidebar-nav {
      display: flex;
      list-style: none;
      gap: var(--space-xs);
      width: 100%;
      justify-content: space-around;
    }
    
    .sidebar-item {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .sidebar-item:hover { background: rgba(20, 20, 30, 0.8); }
    
    .sidebar-item.active {
      background: rgba(0, 245, 255, 0.15);
    }
    
    .sidebar-item.active .sidebar-link { color: var(--neon-cyan); }
    
    .sidebar-link {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: var(--space-sm);
    }
    
    .sidebar-link svg { width: 22px; height: 22px; }
    
    .main-content {
      flex: 1;
      margin-left: 0;
      margin-bottom: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    
    .page-container {
      padding: var(--space-md);
      min-height: calc(100vh - 56px);
    }
    
    /* Dialog styles */
    dialog {
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      background: var(--panel-elevated);
      color: var(--text-primary);
    }
    
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }
    
    /* Responsive tablet+ */
    @media (min-width: 768px) {
      .sidebar {
        top: 0;
        left: 0;
        width: 58px;
        height: 100vh;
        flex-direction: column;
        border-right: 1px solid var(--border-subtle);
        border-top: none;
        padding: var(--space-md) 0;
      }
      
      .sidebar-logo {
        display: flex;
        margin-bottom: var(--space-lg);
      }
      
      .sidebar-nav {
        flex-direction: column;
        width: auto;
      }
      
      .sidebar-version {
        display: block;
        margin-top: auto;
        font-size: 10px;
        color: var(--text-muted);
      }
      
      .main-content {
        margin-left: 58px;
        margin-bottom: 0;
        height: 100vh;
      }
      
      .page-container {
        padding: var(--space-lg);
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Three.js Canvas Background -->
    <div id="canvas-container" class="canvas-container"></div>
    
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar" aria-label="Main navigation"></nav>
    
    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Page Container (dynamically filled) -->
      <div id="page-container" class="page-container"></div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Three.js from CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- App Entry Point -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
